[driver]
id = "vizio.tv"
name = "VIZIO TV"
manufacturer = "VIZIO"
version = "1.0.0"
runtime = "wasm"
primary = true
# Where the app ids come from, since this set cannot be asked. Without this `launch_app` arrives
# with a name and nothing to send, and the driver can only say so — which is exactly what it does.
app_platform = "vizio"

[[proxy]]
id = 1
type = "media_player"
primary = true
name = "VIZIO"
# `has_apps` without the set ever listing one. The two really do come apart here: SmartCast can be
# told to open Netflix over `PUT /app/launch`, and has no local endpoint that says what is
# installed. So `apps` stays empty and core fills the offer from the shared catalog instead — the
# ids are VIZIO's own published values, not this driver's guesses, which is what changed since the
# comment that used to sit here refused the capability outright.
#
# No has_deep_link: `MESSAGE` can carry a title on some apps, but nobody has verified which, and a
# content id that silently opens a home screen is the failure that flag exists to prevent.
capabilities = { has_transport = true, has_dpad = true, has_apps = true, is_video_source = true, is_audio_source = true }

[[proxy]]
id = 2
type = "tv"
name = "Screen"
# Unlike a Hisense over its MQTT broker, SmartCast draws POW_ON and POW_OFF as two distinct key
# codes, and current_input is set by name rather than cycled — both genuinely discrete here.
capabilities = { has_discrete_power = true, has_discrete_input = true, has_volume = true, has_discrete_mute = true }

[[connection]]
id = 1001
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 1"

[[connection]]
id = 1002
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 2"

[[connection]]
id = 1003
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 3"

[[connection]]
id = 1004
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 4"

[[transport]]
kind = "network"
port = 7345

[[property]]
name = "Address"
type = "string"
required = true
tooltip = "IP address of the TV. Settings → Network → Network Connection shows it."

[[property]]
name = "Auth Token"
type = "password"
tooltip = "Issued by pairing — do not edit by hand."

# DIAL SSDP (`urn:dial-multiscreen-org:device:dial:1`) is still not declared, and for the
# original reason: it is shared with every DIAL-capable TV — Roku included — and telling a
# VIZIO apart through it needs the description XML's <manufacturer>, which is enrichment this
# driver does not do.
#
# The two below need no enrichment. `_viziocast._tcp` is VIZIO's own service and nothing else
# advertises it. `_airplay._tcp` is shared with every AirPlay 2 receiver, but a VIZIO says so
# in its TXT — measured on a V505-H9: `manufacturer=VIZIO Inc.`, `model=V505-H9`, beside a
# Hisense Roku on the same network sending `manufacturer=Hisense`. That is exactly the
# manufacturer check the DIAL note wanted, arriving in the announcement instead of needing a
# second request.
[discovery]
mdns = [
  "_viziocast._tcp",
  { service = "_airplay._tcp", txt = { manufacturer = "VIZIO*" } },
]

[driver]
id = "vizio.tv"
name = "VIZIO TV"
manufacturer = "VIZIO"
version = "1.0.0"
runtime = "wasm"
primary = true
# Where the app ids come from, since this set cannot be asked. Without this `launch_app` arrives
# with a name and nothing to send, and the driver can only say so — which is exactly what it does.
app_platform = "vizio"

[[proxy]]
id = 1
type = "media_player"
primary = true
name = "VIZIO"
# `has_apps` without the set ever listing one. The two really do come apart here: SmartCast can be
# told to open Netflix over `PUT /app/launch`, and has no local endpoint that says what is
# installed. So `apps` stays empty and core fills the offer from the shared catalog instead — the
# ids are VIZIO's own published values, not this driver's guesses, which is what changed since the
# comment that used to sit here refused the capability outright.
#
# No has_deep_link: `MESSAGE` can carry a title on some apps, but nobody has verified which, and a
# content id that silently opens a home screen is the failure that flag exists to prevent.
capabilities = { has_transport = true, has_dpad = true, has_apps = true, is_video_source = true, is_audio_source = true }

[[proxy]]
id = 2
type = "tv"
name = "Screen"
# Unlike a Hisense over its MQTT broker, SmartCast draws POW_ON and POW_OFF as two distinct key
# codes, and current_input is set by name rather than cycled — both genuinely discrete here.
capabilities = { has_discrete_power = true, has_discrete_input = true, has_volume = true, has_discrete_mute = true }

[[connection]]
id = 1001
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 1"

[[connection]]
id = 1002
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 2"

[[connection]]
id = 1003
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 3"

[[connection]]
id = 1004
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 4"

[[transport]]
kind = "network"
port = 7345

[[property]]
name = "Address"
type = "string"
required = true
tooltip = "IP address of the TV. Settings → Network → Network Connection shows it."

[[property]]
name = "Auth Token"
type = "password"
tooltip = "Issued by pairing — do not edit by hand."

# No [discovery]: DIAL SSDP (urn:dial-multiscreen-org:device:dial:1) and mDNS
# (_viziocast._tcp) both exist for this, but the SSDP type is shared with every DIAL-capable
# TV — Roku included — and telling a VIZIO apart needs the description XML's <manufacturer>,
# which is enrichment this driver does not do yet. Setup asks for the address by hand instead
# of guessing wrong silently.
